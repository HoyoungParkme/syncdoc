# SYNC-INFRA-001 8장 — docker compose up: app(:8000) + db(:5432). 빌드 컨텍스트는 저장소 루트(backend·frontend·docs를 쓴다)
services:
  app:
    build: .
    restart: unless-stopped  # Docker Desktop이 뜨면 같이 뜬다 — 재부팅을 넘긴다 (#284)
    ports:
      - "127.0.0.1:8000:8000"  # 이 PC에만 — 바깥은 터널(app 네트워크 안쪽)로만 들어온다 (카드 BP)
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://syncdoc:${POSTGRES_PASSWORD:-syncdoc}@db:5432/syncdoc
      REPOS_DIR: /var/syncdoc/repos
      ORIGINS_DIR: /var/syncdoc/origins
    volumes:
      - repos:/var/syncdoc/repos
      - origins:/var/syncdoc/origins  # 서버 저장소 — 원본이다. 백업한다 (INFRA 6장)
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncdoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncdoc}
      POSTGRES_DB: syncdoc
    ports:
      - "127.0.0.1:5432:5432"  # 이 PC에만 (카드 BP)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncdoc"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
  repos:
  origins:
