# 싱크독_로컬 (Rust) 작업 공간 — SYNC-DOM-004 1장
# 의존 판은 여기 한곳에 둔다. Cargo.lock은 커밋한다(실행 파일).

[workspace]
resolver = "3"
members = ["crates/app", "crates/server", "crates/core", "crates/codegraph", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
syncdoc_core = { path = "crates/core" }
syncdoc_server = { path = "crates/server" }

axum = "0.8.9"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
embed-resource = "3"
futures-util = "0.3"
http-body-util = "0.1"
indexmap = "2.14"
httpdate = "1.0"
jiter = "=0.14.0"
num-bigint = "0.4.6"
num-traits = "0.2"
percent-encoding = "2.3"
rand = "0.10"
resvg = { version = "0.48", default-features = false, features = ["text"] }
ryu = "1.0"
rust-embed = { version = "8.12", features = ["interpolate-folder-path", "include-exclude"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "derive", "time"] }
tempfile = "3"
tao = "0.37"
thiserror = "2.0"
time = "0.3"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "process", "signal", "time", "fs", "io-util", "sync"] }
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic"] }
tracing = "0.1.44"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
url = "=2.5.8"
webbrowser = "1.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Environment", "Win32_System_SystemServices", "Win32_System_Threading"] }

[workspace.lints.rust]
# unsafe는 crates/app/src/privilege.rs의 Win32 호출에서만 허용한다(SYNC-DOM-004 4.1)
unsafe_code = "deny"

[profile.release]
lto = "thin"
strip = true
