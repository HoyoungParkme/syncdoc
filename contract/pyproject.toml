# 공용 계약 시험 — SYNC-INFRA-001 9.8 · SYNC-CODE-002 2장 (카드 L2).
# 주소만 받는다 — 앱(backend/·local/)을 import하지 않는다. 그래서 의존성도 따로 둔다.
[project]
name = "syncdoc-contract"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.2",
    "pytest>=9",
    "pytest-asyncio>=1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["card(id): 이 시나리오를 닫는 카드 — Rust 판은 CODE-002에서 완료된 카드만 돈다"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["E501"]
