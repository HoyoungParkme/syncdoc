[project]
name = "syncdoc"
version = "0.1.0"
description = "싱크독 백엔드 — FastAPI + MCP. 명세: ../docs/specs/, 구현 계획: ../docs/specs/11-CODE/SYNC-CODE-001.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "mcp>=1.0",
    "cryptography>=43",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.4",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "graphifyy>=0.9.72",  # 코드 호출 그래프 — tree-sitter, 모델 없음 (INFRA 3장, 카드 AX)
    "tree-sitter>=0.25.2",  # TS/JS 보강 — graphifyy가 이미 끄는 것을 직접 (MS-011 enrich 2a, 카드 BL)
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-rust>=0.24.2",  # Rust 보강 — graphify의 Rust 추출은 함수를 주지 않는다 (MS-011 enrich 2e, 카드 BV)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = []  # 도구·명세는 저장소 루트에 있다 (DOM-002 1장)

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"app/mcp/tools.py" = ["E501"]  # 도구 description은 SYNC-API-002 원문 그대로
"app/core/queries.py" = ["E501"]  # _ASK_TOOLS description·지시문 원문(MS-008) 그대로

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
